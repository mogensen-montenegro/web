<ng-container>
  <header class="topbar">
    <div class="d-flex justify-content-between align-items-center">
      <div class="brand">
        <img src="./assets/img/logo.png" (click)="goHome()" class="logo" alt="Logo Mogensen Montenegro"/>
        <span class="session-user" *ngIf="sessionUser">Usuario: {{ sessionUser }}</span>
      </div>

      <div class="config-wrap" (click)="$event.stopPropagation()">
        <button type="button" class="btn-config" (click)="toggleConfig($event)">
          <i class="fa fa-gear"></i>
          Configuración
        </button>
        <div class="config-menu" *ngIf="configAbierto" [class.is-out]="configSaliendo">
          <button type="button" class="config-menu__item" (click)="irACuenta()">
            <i class="fa fa-gear"></i>
            Tu cuenta
          </button>
          <button type="button" class="config-menu__item" (click)="logout()">
            <i class="fa fa-right-from-bracket"></i>
            Salir
          </button>
        </div>
      </div>

      <div #menuBtn class="col-4 menu_btn" (click)="abrirMenu()">
        <div class="menu_btn_burger"></div>
      </div>
    </div>

    <div #menuDesplegado class="menu-desplegado">
      <div class="container pt-5">
        <div class="nav-item d-flex align-items-center">
          <i class="fa fa-home color-principal"></i>
          <a class="nav-link" routerLink="/panel/gym/notice">Noticia</a>
        </div>

        <hr class="linea-divisora"/>
        <div class="nav-item d-flex align-items-center pt-3">
          <i class="fa fa-user-gear color-principal"></i>
          <a class="nav-link" (click)="irACuenta()">Tu cuenta</a>
        </div>
        <div class="nav-item d-flex align-items-center pt-3">
          <i class="fa fa-sign-out color-principal"></i>
          <a class="nav-link" (click)="logout()">Salir</a>
        </div>
      </div>
    </div>
  </header>
</ng-container>
