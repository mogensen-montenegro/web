<aside class="left-sidebar" [class.is-collapsed]="collapsed">
  <div class="sidebar-toolbar">
    <button
      type="button"
      class="sidebar-toggle"
      (click)="toggle()"
      [attr.title]="collapsed ? 'Abrir menú' : 'Cerrar menú'"
      [attr.aria-label]="collapsed ? 'Abrir menú' : 'Cerrar menú'">
      <i class="fa" [ngClass]="collapsed ? 'fa-angle-right' : 'fa-angle-left'"></i>
    </button>
  </div>

  <div class="scroll-sidebar">
    <nav class="sidebar-nav">
      <ul id="sidebarnav">
        <li
          *ngFor="let item of visibleItems"
          [id]="item.id"
          class="sidebar-item d-flex align-items-center"
          [ngClass]="{'pt-3': item.id !== 'home' && item.id !== 'userMessage'}"
          [attr.title]="collapsed ? item.name : null">
          <a
            class="sidebar-link has-arrow waves-effect waves-dark"
            [routerLink]="item.url"
            routerLinkActive="active">
            <div class="icon-wrap">
              <i class="fa color-principal" [ngClass]="item.icon"></i>
              <ng-container *ngIf="item.id === 'prospectos' && showProspectosNuevosBadge">
                <ng-container *ngIf="prospectosNuevosSrv.getCount$() | async as total">
                  <span *ngIf="total > 0" class="sidebar-icon-badge">{{ total }}</span>
                </ng-container>
              </ng-container>
            </div>
            <span class="select-option sidebar-label">{{ item.name }}</span>
            <ng-container *ngIf="item.id === 'base' && showArchivosNuevosBadge">
              <ng-container *ngIf="archivosNuevosSrv.getTotalNew$() | async as total">
                <span *ngIf="total > 0" class="sidebar-archivos-nuevos-badge">{{ total }}</span>
              </ng-container>
            </ng-container>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</aside>
