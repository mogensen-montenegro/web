<div class="drive-sheet">
  <div class="drive-fmt" *ngIf="puedeEditar">
    <select
      class="drive-fmt__select"
      [ngModel]="estiloCelda.font"
      (ngModelChange)="aplicarEstiloHoja({ font: $event })"
      aria-label="Tipo de fuente">
      <option *ngFor="let fuente of fuentes" [value]="fuente">{{ fuente }}</option>
    </select>
    <div class="drive-fmt__size">
      <button type="button" (click)="cambiarTamanioHoja(-1)" title="Reducir tamaño">−</button>
      <input
        type="number"
        min="8"
        max="72"
        [value]="estiloCelda.size"
        (change)="setTamanioHoja($any($event.target).value)"
        aria-label="Tamaño de fuente">
      <button type="button" (click)="cambiarTamanioHoja(1)" title="Aumentar tamaño">+</button>
    </div>
    <span class="drive-fmt__sep"></span>
    <button type="button" [class.is-on]="estiloCelda.bold" (click)="toggleEstiloHoja('bold')" title="Negrita"><b>B</b></button>
    <button type="button" [class.is-on]="estiloCelda.italic" (click)="toggleEstiloHoja('italic')" title="Cursiva"><i>I</i></button>
    <button type="button" [class.is-on]="estiloCelda.underline" (click)="toggleEstiloHoja('underline')" title="Subrayado"><u>U</u></button>
    <span class="drive-fmt__sep"></span>
    <div class="drive-fmt__swatch">
      <button type="button" class="drive-fmt__tone" (click)="togglePaleta('color', $event)" title="Color de texto">
        <span class="drive-fmt__letter">A</span>
        <span class="drive-fmt__bar" [style.background]="estiloCelda.color"></span>
      </button>
      <div class="drive-fmt__pop" *ngIf="paleta === 'color'" (click)="$event.stopPropagation()">
        <button
          type="button"
          *ngFor="let color of colores"
          [style.background]="color"
          [title]="color"
          (click)="aplicarEstiloHoja({ color: color })"></button>
      </div>
    </div>
    <div class="drive-fmt__swatch">
      <button type="button" class="drive-fmt__tone" (click)="togglePaleta('fill', $event)" title="Color de resaltado">
        <i class="fa fa-pencil"></i>
        <span class="drive-fmt__bar" [style.background]="estiloCelda.fill || '#fff59d'"></span>
      </button>
      <div class="drive-fmt__pop" *ngIf="paleta === 'fill'" (click)="$event.stopPropagation()">
        <button type="button" class="is-clear" (click)="aplicarEstiloHoja({ fill: '' })">Sin color</button>
        <button
          type="button"
          *ngFor="let color of colores"
          [style.background]="color"
          [title]="color"
          (click)="aplicarEstiloHoja({ fill: color })"></button>
      </div>
    </div>
    <span class="drive-fmt__sep"></span>
    <button type="button" [class.is-on]="estiloCelda.align === 'left'" (click)="aplicarEstiloHoja({ align: 'left' })" title="Alinear a la izquierda">
      <i class="fa fa-align-left"></i>
    </button>
    <button type="button" [class.is-on]="estiloCelda.align === 'center'" (click)="aplicarEstiloHoja({ align: 'center' })" title="Centrar">
      <i class="fa fa-align-center"></i>
    </button>
    <button type="button" [class.is-on]="estiloCelda.align === 'right'" (click)="aplicarEstiloHoja({ align: 'right' })" title="Alinear a la derecha">
      <i class="fa fa-align-right"></i>
    </button>
  </div>
  <div class="drive-sheet__tabs" *ngIf="hojas.length > 1">
    <button
      type="button"
      *ngFor="let hoja of hojas; let i = index"
      [class.is-active]="i === hojaActiva"
      (click)="activarHoja(i)">
      {{ hoja.name }}
    </button>
  </div>
  <div class="drive-sheet__table-wrap">
    <table>
      <thead>
        <tr>
          <th></th>
          <th *ngFor="let col of columnas">{{ col }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let fila of filas; let r = index">
          <th>{{ r + 1 }}</th>
          <td
            *ngFor="let celda of fila; let c = index"
            [class.is-sel]="esSeleccionada(r, c)"
            [style.background]="celda.fill || null"
            (mousedown)="iniciarSeleccion(r, c, $event)"
            (mouseenter)="extenderSeleccion(r, c)">
            <input
              [ngModel]="celda.v"
              (ngModelChange)="cambiarValorCelda(celda, $event)"
              (focus)="iniciarSeleccion(r, c, $event)"
              [disabled]="!puedeEditar"
              [style.font-weight]="celda.bold ? '700' : '400'"
              [style.font-style]="celda.italic ? 'italic' : 'normal'"
              [style.text-decoration]="celda.underline ? 'underline' : 'none'"
              [style.color]="celda.color"
              [style.font-family]="celda.font"
              [style.font-size.px]="celda.size"
              [style.text-align]="celda.align" />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="drive-sheet__tools" *ngIf="puedeEditar">
    <button type="button" (click)="agregarFila()">+ Fila</button>
    <button type="button" (click)="agregarColumna()">+ Columna</button>
  </div>
</div>
