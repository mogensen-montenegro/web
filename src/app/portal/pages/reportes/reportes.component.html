<div class="reportes">
  <app-reportes-hero
    [vista]="vista"
    (vistaChange)="cambiarVista($event)"
    (exportar)="abrirExportar()">
  </app-reportes-hero>

  <app-reportes-filtros
    [titulo]="filtroTitulo"
    [subtitulo]="filtroSubtitulo"
    [empleados]="empleados"
    [empleado]="empleadoSeleccionado"
    [dia]="diaSeleccionado"
    [mes]="mesSeleccionado"
    [anio]="anioSeleccionado"
    [dias]="dias"
    [meses]="meses"
    [anios]="anios"
    (empleadoChange)="empleadoSeleccionado = $event"
    (diaChange)="diaSeleccionado = $event"
    (mesChange)="mesSeleccionado = $event"
    (anioChange)="anioSeleccionado = $event"
    (aplicar)="aplicarFiltros()"
    (limpiar)="limpiarFiltros()">
  </app-reportes-filtros>

  <app-reportes-resumen *ngIf="!loading" [resumen]="resumen"></app-reportes-resumen>

  <app-reportes-historial
    *ngIf="!loading"
    [vista]="vista"
    [titulo]="historialTitulo"
    [tituloTimeline]="timelineTitulo"
    [registros]="registros"
    [timeline]="resumen.timeline">
  </app-reportes-historial>

  <app-reportes-pdf-modal
    [abierto]="exportAbierto"
    [saliendo]="exportSaliendo"
    [exportando]="exportando"
    [empleados]="empleados"
    [alcance]="exportAlcance"
    [empleado]="exportEmpleado"
    [desde]="exportDesde"
    [hasta]="exportHasta"
    (alcanceChange)="exportAlcance = $event"
    (empleadoChange)="exportEmpleado = $event"
    (desdeChange)="exportDesde = $event"
    (hastaChange)="exportHasta = $event"
    (cerrar)="cerrarExportar()"
    (generar)="generarPdf()">
  </app-reportes-pdf-modal>

  <div class="loader-overlay" *ngIf="loading">
    <div class="loader-text">Cargando reportes...</div>
  </div>
</div>
